<!doctype html><html lang="en"><meta charset="utf-8"><title>Canada Joloo browser integration checks</title><script src="../content.js"></script><script src="../questions.js"></script><style>body{font:14px monospace}iframe{border:1px solid #ccc;width:390px;height:844px}pre{white-space:pre-wrap}</style><pre id="results">RUNNING</pre><iframe title="App under test"></iframe><script>
(async()=>{
const output=document.querySelector('#results'),frame=document.querySelector('iframe'),lines=[],errors=[];
const assert=(condition,label)=>{if(!condition)throw Error(label);lines.push('PASS '+label);output.textContent=lines.join('\n');};
const tick=()=>new Promise(r=>setTimeout(r,45));
let w,d,loadCount=0;const load=async(hash='home')=>{await new Promise(r=>{frame.onload=r;frame.src='../index.html?browsercheck='+(++loadCount)+'#'+hash;});w=frame.contentWindow;d=frame.contentDocument;w.addEventListener('error',e=>errors.push(e.message));await tick();};
const click=selector=>{const el=d.querySelector(selector);if(!el)throw Error('Missing '+selector);el.click();};
const route=async(hash)=>{w.location.hash=hash;await tick();};
const change=(selector,value,type='change')=>{const el=d.querySelector(selector);el.value=value;el.dispatchEvent(new w.Event(type,{bubbles:true}));};
const snapshot={local:localStorage.getItem('zam-learning-v2'),old:localStorage.getItem('zam-progress-v1'),session:sessionStorage.getItem('zam-session-v2')};
try{
 localStorage.removeItem('zam-learning-v2');localStorage.removeItem('zam-progress-v1');sessionStorage.removeItem('zam-session-v2');
 assert(CHAPTERS.length===10,'Official ten-chapter structure');
 assert(new Set(QUESTIONS.map(q=>q.id)).size===QUESTIONS.length,'Unique question IDs');
 assert(QUESTIONS.every(q=>{const l=LESSONS.find(l=>l.id===q.lesson),c=CHAPTERS.find(c=>c.id===q.chapter);return l&&l.chapter===c.id&&q.page>=c.start&&q.page<=c.end&&q.options.length===4&&q.correct>=0&&q.correct<4;}),'Every question has a valid chapter, exact source page and answer');
 const paths=[...new Set([...LESSONS.filter(l=>l.image).map(l=>'assets/figures/'+l.image+'.jpg'),...QUESTIONS.filter(q=>q.image).map(q=>'assets/figures/'+q.image+'.jpg'),...CHAPTERS.flatMap(c=>Array.from({length:c.end-c.start+1},(_,i)=>'assets/guide/page-'+String(c.start+i+2).padStart(3,'0')+'.jpg'))])];
 const statuses=await Promise.all(paths.map(p=>fetch('../'+p,{method:'HEAD'}).then(r=>r.ok)));assert(statuses.every(Boolean),'All original handbook pages and question figures are served');
 await load();assert(d.querySelectorAll('.entry').length===3,'Home has three entry points');assert(w.getComputedStyle(d.querySelector('.mobile-nav')).display==='grid','Mobile bottom navigation visible');assert(!d.querySelector('svg'),'No generated SVG illustrations');
 for(const size of [320,390,768,1280]){frame.style.width=size+'px';await tick();assert(d.documentElement.scrollWidth<=size,`Home fits ${size}px`);}frame.style.width='390px';await tick();
 await route('learn');assert(d.querySelectorAll('.chapter-card').length===10,'Ten chapters can be opened');click('a[href="#chapter/2"]');await tick();assert(d.querySelectorAll('.lesson-row').length===4,'Chapter shows individual lessons');click('a[href="#lesson/signals"]');await tick();assert(d.querySelector('.rules li'),'Mongolian lesson content exists');click('[data-action="mark-read"]');click('[data-action="mark-read"]');assert(JSON.parse(localStorage.getItem('zam-learning-v2')).read.length===1,'Read progress is idempotent');click('.figure button');assert(d.querySelector('dialog').open,'Original image opens in dialog');d.querySelector('[data-action="close-image"]').click();assert(!d.querySelector('dialog').open,'Image dialog closes');click('.reference');await tick();assert(d.querySelector('.reader-image img').getAttribute('src').endsWith('page-024.jpg'),'Reader opens the exact printed page');await new Promise(r=>setTimeout(r,100));assert(d.querySelector('#page-text').textContent.includes('Traffic control signals'),'Reader has accessible original English text');click('[data-reader="23"]');await tick();assert(d.querySelector('.reader-page').value==='23','Reader advances to next original page');
 await route('words');change('#word-search','yield','input');assert(d.querySelectorAll('.word-card').length===1,'English glossary search');change('#word-search','сохор','input');assert(d.querySelectorAll('.word-card').length>0,'Mongolian glossary search');change('#word-search','<img onerror=alert(1)>','input');assert(d.querySelector('.empty')&&!d.querySelector('#word-results img'),'Empty search is safe');click('[data-action="clear-words"]');assert(d.querySelectorAll('.word-card').length===WORDS.length,'Clear search restores glossary');change('#word-chapter','10');assert(d.querySelectorAll('.word-card').length===3,'Glossary chapter filter');
 await route('exam?chapter=2');change('#question-count','3','input');click('button[type="submit"]');await tick();assert(w.eval('session.ids.length')===3,'Custom question count respected');assert(w.eval('session.ids.every(id=>byQuestion(id).chapter===2)'),'Questions filtered by chapter');assert(w.eval('new Set(session.ids).size')===3,'Random selection has no duplicates');assert(d.querySelector('#answer-button').disabled,'Answer required before checking');
 const q=w.eval('byQuestion(session.ids[session.index])');const wrong=(q.correct+1)%4;click('[data-answer="'+wrong+'"]');click('[data-action="check-answer"]');assert(d.querySelector('.feedback.bad'),'Incorrect answer gives Mongolian explanation');const href=d.querySelector('.feedback a').getAttribute('href');assert(href==='#lesson/'+q.lesson+'?page='+q.page,'Feedback deep-links to exact lesson and source page');click('.feedback a');await tick();assert(d.querySelector('.resume-strip'),'Lesson offers return to active quiz');click('.resume-strip a');await tick();assert(w.eval('session.checked')&&d.querySelector('.feedback.bad'),'Answer survives lesson round trip');
 await new Promise(r=>{frame.onload=r;w.location.reload();});w=frame.contentWindow;d=frame.contentDocument;await tick();assert(w.eval('session.checked && session.answers.length===1'),'Reload restores checked answer without double counting');click('[data-action="next-question"]');assert(w.eval('session.index')===1,'Resume continues to the next question');
 await route('exam');change('#exam-chapter','all');change('#question-count','30','input');click('button[type="submit"]');await tick();const ids=w.eval('[...session.ids]');assert(ids.length===30&&new Set(ids).size===30,'30-question exam is unique');
 for(let i=0;i<30;i++){const correct=w.eval('byQuestion(session.ids[session.index]).correct');click('[data-answer="'+(i<25?correct:(correct+1)%4)+'"]');click('[data-action="check-answer"]');assert(d.querySelector('.feedback'),'Immediate feedback for question '+(i+1));click('[data-action="next-question"]');}await tick();assert(d.querySelector('.score-ring').textContent==='25/30','Result counts 25 correct answers exactly');assert(d.querySelectorAll('.result-list details').length===30,'All exam questions can be reviewed');click('[data-action="retry"]');await tick();assert(w.eval('session.ids.length')===5,'Retry includes exactly the five mistakes');assert(w.eval('session.ids.every(id=>progress.answers[id]===false)'),'Retry uses incorrect answers only');
 await route('exam');change('#exam-chapter','10');change('#question-count','999','input');click('button[type="submit"]');await tick();assert(d.querySelector('#exam-form')&&!d.querySelector('.question-card'),'Invalid question count cannot start an exam');
 await route('lesson/priority');for(const size of [320,390,768,1280]){frame.style.width=size+'px';await tick();assert(d.documentElement.scrollWidth<=size,`Lesson fits ${size}px`);}frame.style.width='390px';
 await route('quiz');assert(d.documentElement.scrollWidth<=390,'Quiz fits phone width');await route('sources');assert(d.querySelector('a[href="https://open.alberta.ca/licence"]'),'Source and licence attribution present');
 assert(errors.length===0,'No browser JavaScript errors');
 localStorage.setItem('zam-learning-v2','bad json');sessionStorage.setItem('zam-session-v2',JSON.stringify({version:2,ids:['nonexistent']}));await load('learn');assert(d.querySelectorAll('.chapter-card').length===10,'Corrupt persisted data recovers safely');
 output.textContent=lines.join('\n')+'\nALL PASSED ('+lines.length+' checks)';
}catch(e){output.textContent=lines.join('\n')+'\nFAIL '+e.stack;}finally{
 for(const [storage,key,value] of [[localStorage,'zam-learning-v2',snapshot.local],[localStorage,'zam-progress-v1',snapshot.old],[sessionStorage,'zam-session-v2',snapshot.session]]){if(value===null)storage.removeItem(key);else storage.setItem(key,value);}
}
})();
</script></html>
